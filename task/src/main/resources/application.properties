spring.application.name=Task_Project

server.port=8888

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_task?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.type-aliases-package=com.svtu.entity
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml


jwt.secret=abcdefghijklmnopqrstuvwxyz1234567890
jwt.expire=86400000


spring.redis.host=localhost
spring.redis.port=6379

spring.security.user.name=admin;
spring.security.user.password=123456;
spring.security.user.roles=USER

# ??????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# RabbitMQ??
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==================支付宝沙箱配置（请勿将真实私钥提交到公开仓库，以下请替换为你自己的沙箱参数）==================
alipay.app-id=替换为你的沙箱APPID
alipay.app-private-key=替换为你的沙箱应用私钥
alipay.alipay-public-key=替换为你的沙箱支付宝公钥
alipay.gateway=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.notify-url=http://localhost:8888/pay/notify
alipay.return-url=http://localhost:5173/payResult
